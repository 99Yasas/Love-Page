<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5, #ffd1e3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Main Question Card */
        .card {
            width: 360px;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(150, 50, 90, 0.25);
            position: relative;
            z-index: 20;

            transition: 0.6s ease;
        }

        .card.hide {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.75);
            pointer-events: none;
        }

        .main-heart {
            font-size: 55px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            margin: 10px 0;
            color: #d6336c;
            font-size: 32px;
        }

        .question {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s ease;
        }

        #yesBtn {
            background: #ff4f87;
            color: white;
            box-shadow: 0 6px 15px rgba(255, 79, 135, 0.35);
        }

        #yesBtn:hover {
            transform: scale(1.08);
        }

        #noBtn {
            background: #eee;
            color: #555;
            position: relative;
        }

        /* Love message */
        .love-message {
            position: fixed;
            z-index: 25;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);

            width: min(90%, 430px);
            padding: 25px;

            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            text-align: center;

            box-shadow: 0 15px 45px rgba(150, 50, 90, 0.25);

            opacity: 0;
            visibility: hidden;

            transition: 0.6s ease;
        }

        .love-message.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .love-message h2 {
            color: #d6336c;
            margin: 0 0 10px;
            font-size: 28px;
        }

        .love-message p {
            color: #555;
            font-size: 17px;
            line-height: 1.5;
            margin: 0;
        }

        /* Photos */
        .photo-container {
            position: fixed;
            inset: 0;
            z-index: 10;

            opacity: 0;
            visibility: hidden;

            transition: 0.5s ease;
        }

        .photo-container.show {
            opacity: 1;
            visibility: visible;
        }

        .photo {
            position: absolute;

            width: 135px;
            height: 165px;

            background: white;
            padding: 7px;
            padding-bottom: 18px;

            border-radius: 8px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.18);

            opacity: 0;
            transform: scale(0.5);

            transition:
                opacity 0.6s ease,
                transform 0.6s ease;
        }

        .photo-container.show .photo {
            opacity: 1;
            transform: scale(1);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        /* Photo positions */

        .photo1 {
            top: 8%;
            left: 8%;
            transform: rotate(-8deg) scale(0.5);
        }

        .photo2 {
            top: 42%;
            left: 5%;
            transform: rotate(6deg) scale(0.5);
        }

        .photo3 {
            bottom: 7%;
            left: 10%;
            transform: rotate(-5deg) scale(0.5);
        }

        .photo4 {
            top: 8%;
            right: 8%;
            transform: rotate(7deg) scale(0.5);
        }

        .photo5 {
            top: 42%;
            right: 5%;
            transform: rotate(-6deg) scale(0.5);
        }

        .photo6 {
            bottom: 7%;
            right: 10%;
            transform: rotate(5deg) scale(0.5);
        }

        .photo7 {
            top: 3%;
            left: 50%;
            margin-left: -67px;
            transform: rotate(-3deg) scale(0.5);
        }

        /* Keep rotations after appearing */

        .photo-container.show .photo1 {
            transform: rotate(-8deg) scale(1);
            transition-delay: 0.1s;
        }

        .photo-container.show .photo2 {
            transform: rotate(6deg) scale(1);
            transition-delay: 0.25s;
        }

        .photo-container.show .photo3 {
            transform: rotate(-5deg) scale(1);
            transition-delay: 0.4s;
        }

        .photo-container.show .photo4 {
            transform: rotate(7deg) scale(1);
            transition-delay: 0.55s;
        }

        .photo-container.show .photo5 {
            transform: rotate(-6deg) scale(1);
            transition-delay: 0.7s;
        }

        .photo-container.show .photo6 {
            transform: rotate(5deg) scale(1);
            transition-delay: 0.85s;
        }

        .photo-container.show .photo7 {
            transform: rotate(-3deg) scale(1);
            transition-delay: 1s;
        }

        /* Floating hearts */

        .heart {
            position: fixed;
            pointer-events: none;
            z-index: 50;

            font-size: 22px;

            animation: floatHeart 2.5s linear forwards;
        }

        @keyframes floatHeart {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-180px) scale(1.8);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* Mobile */
        @media (max-width: 700px) {

            .card {
                width: 300px;
                padding: 30px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .photo {
                width: 95px;
                height: 120px;
                padding: 5px;
                padding-bottom: 13px;
            }

            .photo1 {
                top: 7%;
                left: 2%;
            }

            .photo2 {
                top: 39%;
                left: 1%;
            }

            .photo3 {
                bottom: 5%;
                left: 3%;
            }

            .photo4 {
                top: 7%;
                right: 2%;
            }

            .photo5 {
                top: 39%;
                right: 1%;
            }

            .photo6 {
                bottom: 5%;
                right: 3%;
            }

            .photo7 {
                top: 2%;
                left: 50%;
                margin-left: -47px;
            }

            .love-message {
                width: 70%;
                padding: 20px;
            }

            .love-message h2 {
                font-size: 23px;
            }

            .love-message p {
                font-size: 14px;
            }
        }

        @media (max-width: 450px) {

            .photo {
                width: 78px;
                height: 100px;
            }

            .photo7 {
                margin-left: -39px;
            }

            .photo1 {
                left: 1%;
            }

            .photo3 {
                left: 2%;
            }

            .photo4 {
                right: 1%;
            }

            .photo6 {
                right: 2%;
            }
        }
    </style>
</head>

<body>

    <!-- QUESTION -->
    <div class="card" id="questionCard">

        <div class="main-heart">❤️</div>

        <h1>Do you love me?</h1>

        <div class="question">
            Please choose your answer carefully... 😌
        </div>

        <div class="buttons">
            <button id="yesBtn">YES ❤️</button>
            <button id="noBtn">NO 😢</button>
        </div>

    </div>


    <!-- PHOTOS -->
    <div class="photo-container" id="photoContainer">

        <div class="photo photo1">
            <img src="image1.jpg" alt="Photo 1">
        </div>

        <div class="photo photo2">
            <img src="image2.jpg" alt="Photo 2">
        </div>

        <div class="photo photo3">
            <img src="image3.jpg" alt="Photo 3">
        </div>

        <div class="photo photo4">
            <img src="image4.jpg" alt="Photo 4">
        </div>

        <div class="photo photo5">
            <img src="image5.jpg" alt="Photo 5">
        </div>

        <div class="photo photo6">
            <img src="image6.jpg" alt="Photo 6">
        </div>

        <div class="photo photo7">
            <img src="image7.jpg" alt="Photo 7">
        </div>

    </div>


    <!-- LOVE MESSAGE -->
    <div class="love-message" id="loveMessage">

        <h2>I knew it! ❤️</h2>

        <p>
            I love you too! 🥰<br>
            You are the most special person in my life.
            <br><br>
            ❤️ Forever & Always ❤️
        </p>

    </div>


    <script>

        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");

        const questionCard = document.getElementById("questionCard");
        const loveMessage = document.getElementById("loveMessage");
        const photoContainer = document.getElementById("photoContainer");


        /* =========================
           YES BUTTON
        ========================= */

        yesBtn.addEventListener("click", function () {

            // Hide the question completely
            questionCard.classList.add("hide");

            // Show photos
            photoContainer.classList.add("show");

            // Show love message
            loveMessage.classList.add("show");

            // Create celebration hearts
            for (let i = 0; i < 70; i++) {

                setTimeout(function () {
                    createHeart();
                }, i * 50);

            }

        });


        /* =========================
           NO BUTTON
        ========================= */

        let noMessages = [
            "NO 😢",
            "NO, Are you sure? 😭",
            "NO, Really? 🥺",
            "NO, Think again! 😭",
            "NO, Please? 🥹",
            "NO, Wrong button! 😂",
            "NO, Try YES ❤️"
        ];

        let noCount = 0;


        document.addEventListener("mousemove", function (event) {

            if (questionCard.classList.contains("hide")) {
                return;
            }

            const rect = noBtn.getBoundingClientRect();

            const buttonX = rect.left + rect.width / 2;
            const buttonY = rect.top + rect.height / 2;

            const distance = Math.sqrt(
                Math.pow(event.clientX - buttonX, 2) +
                Math.pow(event.clientY - buttonY, 2)
            );


            if (distance < 120) {

                const maxX = window.innerWidth - noBtn.offsetWidth - 20;
                const maxY = window.innerHeight - noBtn.offsetHeight - 20;

                const randomX = Math.random() * maxX;
                const randomY = Math.random() * maxY;

                noBtn.style.position = "fixed";
                noBtn.style.left = randomX + "px";
                noBtn.style.top = randomY + "px";

                noCount++;

                if (noCount < noMessages.length) {
                    noBtn.innerText = noMessages[noCount];
                }

                // Make YES button bigger
                yesBtn.style.transform =
                    "scale(" + (1 + noCount * 0.08) + ")";

            }

        });


        /* =========================
           CREATE FLOATING HEART
        ========================= */

        function createHeart(x, y) {

            const heart = document.createElement("div");

            heart.classList.add("heart");

            const hearts = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💓",
                "💞"
            ];

            heart.innerText =
                hearts[Math.floor(Math.random() * hearts.length)];


            if (x === undefined) {
                x = Math.random() * window.innerWidth;
            }

            if (y === undefined) {
                y = window.innerHeight;
            }

            heart.style.left = x + "px";
            heart.style.top = y + "px";

            heart.style.fontSize =
                (15 + Math.random() * 25) + "px";


            document.body.appendChild(heart);


            setTimeout(function () {
                heart.remove();
            }, 3000);

        }


        /* =========================
           CLICK ANYWHERE = HEART
        ========================= */

        document.addEventListener("click", function (event) {

            // Don't create extra hearts when clicking buttons
            if (
                event.target === yesBtn ||
                event.target === noBtn
            ) {
                return;
            }

            createHeart(event.clientX, event.clientY);

        });


    </script>

</body>
</html>
