<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Important Question ❤️</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {

            margin: 0;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #fff0f5
                );

            position: relative;

        }



        /* =========================================
           PHOTO AREA
        ========================================= */

        .photo-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 3;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1s ease;

        }


        /* Show photos after YES */

        .photo-container.show {

            opacity: 1;

            visibility: visible;

        }



        /* =========================================
           INDIVIDUAL PHOTO
        ========================================= */

        .photo {

            position: absolute;

            width: 150px;

            height: 180px;

            padding: 8px 8px 28px 8px;

            background: white;

            border-radius: 5px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.20);

            object-fit: cover;

            opacity: 0;

            transform:
                scale(0.3)
                rotate(0deg);

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;

        }


        .photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* =========================================
           PHOTO POSITIONS
        ========================================= */

        .photo1 {

            left: 5%;

            top: 8%;

            transform:
                scale(0.3)
                rotate(-12deg);

        }


        .photo2 {

            left: 3%;

            top: 56%;

            transform:
                scale(0.3)
                rotate(9deg);

        }


        .photo3 {

            left: 20%;

            top: 75%;

            transform:
                scale(0.3)
                rotate(-7deg);

        }


        .photo4 {

            right: 5%;

            top: 8%;

            transform:
                scale(0.3)
                rotate(11deg);

        }


        .photo5 {

            right: 3%;

            top: 55%;

            transform:
                scale(0.3)
                rotate(-9deg);

        }


        .photo6 {

            right: 20%;

            top: 75%;

            transform:
                scale(0.3)
                rotate(7deg);

        }


        .photo7 {

            left: 50%;

            top: 2%;

            transform:
                translateX(-50%)
                scale(0.3)
                rotate(-3deg);

        }



        /* =========================================
           PHOTO ANIMATION
        ========================================= */

        .photo-container.show .photo {

            opacity: 1;

        }


        .photo-container.show .photo1 {

            transform:
                scale(1)
                rotate(-12deg);

            transition-delay: 0.1s;

        }


        .photo-container.show .photo2 {

            transform:
                scale(1)
                rotate(9deg);

            transition-delay: 0.25s;

        }


        .photo-container.show .photo3 {

            transform:
                scale(1)
                rotate(-7deg);

            transition-delay: 0.4s;

        }


        .photo-container.show .photo4 {

            transform:
                scale(1)
                rotate(11deg);

            transition-delay: 0.55s;

        }


        .photo-container.show .photo5 {

            transform:
                scale(1)
                rotate(-9deg);

            transition-delay: 0.7s;

        }


        .photo-container.show .photo6 {

            transform:
                scale(1)
                rotate(7deg);

            transition-delay: 0.85s;

        }


        .photo-container.show .photo7 {

            transform:
                translateX(-50%)
                scale(1)
                rotate(-3deg);

            transition-delay: 1s;

        }



        /* =========================================
           MAIN CARD
        ========================================= */

        .card {

            width: 90%;

            max-width: 520px;

            padding: 45px 30px;

            text-align: center;

            background:
                rgba(255,255,255,0.94);

            border-radius: 30px;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,0.15);

            position: relative;

            z-index: 10;

        }



        /* =========================================
           HEART
        ========================================= */

        .main-heart {

            font-size: 65px;

            animation:
                heartbeat
                1.2s
                infinite;

        }


        @keyframes heartbeat {

            0% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.2);

            }

            100% {

                transform: scale(1);

            }

        }



        /* =========================================
           QUESTION
        ========================================= */

        h1 {

            color: #ff4081;

            font-size: 38px;

            margin: 15px 0;

        }


        p {

            color: #777;

            font-size: 17px;

            margin-bottom: 35px;

        }



        /* =========================================
           BUTTON AREA
        ========================================= */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 25px;

            min-height: 60px;

        }


        button {

            border: none;

            padding: 15px 35px;

            border-radius: 30px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }



        /* =========================================
           YES BUTTON
        ========================================= */

        #yesBtn {

            background: #ff4081;

            color: white;

            box-shadow:
                0 5px 15px
                rgba(255,64,129,0.4);

            transition:
                transform 0.2s;

        }


        #yesBtn:hover {

            transform: scale(1.08);

        }



        /* =========================================
           NO BUTTON
        ========================================= */

        #noBtn {

            background: #dddddd;

            color: #555;

            z-index: 100;

            white-space: nowrap;

            transition:
                left 0.15s ease,
                top 0.15s ease;

        }



        /* =========================================
           LOVE MESSAGE
        ========================================= */

        #loveMessage {

            display: none;

            margin-top: 30px;

            color: #ff4081;

            font-size: 26px;

            font-weight: bold;

        }



        /* =========================================
           CLICK HEART
        ========================================= */

        .heart {

            position: fixed;

            pointer-events: none;

            z-index: 999;

            font-size: 25px;

            animation:
                floatHeart
                2s
                ease-out
                forwards;

        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    scale(0.5);

                opacity: 1;

            }

            100% {

                transform:
                    translateY(-180px)
                    scale(1.5);

                opacity: 0;

            }

        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 900px) {

            .photo {

                width: 110px;

                height: 135px;

                padding: 6px 6px 22px 6px;

            }


            .photo1 {

                left: 1%;

                top: 5%;

            }


            .photo2 {

                left: 1%;

                top: 65%;

            }


            .photo3 {

                left: 12%;

                top: 82%;

            }


            .photo4 {

                right: 1%;

                top: 5%;

            }


            .photo5 {

                right: 1%;

                top: 65%;

            }


            .photo6 {

                right: 12%;

                top: 82%;

            }


            .photo7 {

                top: 1%;

            }

        }


        @media (max-width: 600px) {

            h1 {

                font-size: 30px;

            }


            .card {

                padding: 35px 20px;

                max-width: 390px;

            }


            .main-heart {

                font-size: 55px;

            }


            button {

                padding: 13px 27px;

                font-size: 16px;

            }


            .photo {

                width: 80px;

                height: 100px;

                padding: 4px 4px 16px 4px;

            }


            .photo1 {

                left: 0%;

                top: 12%;

            }


            .photo2 {

                left: 0%;

                top: 58%;

            }


            .photo3 {

                left: 8%;

                top: 82%;

            }


            .photo4 {

                right: 0%;

                top: 12%;

            }


            .photo5 {

                right: 0%;

                top: 58%;

            }


            .photo6 {

                right: 8%;

                top: 82%;

            }


            .photo7 {

                top: 1%;

            }

        }

    </style>

</head>



<body>


    <!-- =========================================
         7 PHOTOS
         HIDDEN UNTIL YES IS CLICKED
    ========================================== -->

    <div class="photo-container" id="photoContainer">


        <div class="photo photo1">

            <img
                src="image1.jpg"
                alt="Our photo 1"
            >

        </div>


        <div class="photo photo2">

            <img
                src="image2.jpg"
                alt="Our photo 2"
            >

        </div>


        <div class="photo photo3">

            <img
                src="image3.jpg"
                alt="Our photo 3"
            >

        </div>


        <div class="photo photo4">

            <img
                src="image4.jpg"
                alt="Our photo 4"
            >

        </div>


        <div class="photo photo5">

            <img
                src="image5.jpg"
                alt="Our photo 5"
            >

        </div>


        <div class="photo photo6">

            <img
                src="image6.jpg"
                alt="Our photo 6"
            >

        </div>


        <div class="photo photo7">

            <img
                src="image7.jpg"
                alt="Our photo 7"
            >

        </div>


    </div>



    <!-- =========================================
         MAIN CARD
    ========================================== -->

    <div class="card">


        <div class="main-heart">

            ❤️

        </div>


        <h1>

            Do you love me?

        </h1>


        <p>

            Please choose your answer carefully... 😌

        </p>


        <div class="buttons">


            <button id="yesBtn">

                YES ❤️

            </button>


            <button id="noBtn">

                NO 😏

            </button>


        </div>


        <div id="loveMessage">

            I KNEW IT!!! 😍❤️

            <br>

            <span
                style="
                    font-size:17px;
                    color:#888;
                "
            >

                You can't escape me now 😌💕

            </span>

        </div>


    </div>



    <script>


        /* =========================================
           GET ELEMENTS
        ========================================= */

        const yesButton =
            document.getElementById("yesBtn");


        const noButton =
            document.getElementById("noBtn");


        const loveMessage =
            document.getElementById("loveMessage");


        const photoContainer =
            document.getElementById("photoContainer");



        let escapeCount = 0;

        let lastMove = 0;

        let pageStarted = false;



        /* =========================================
           WAIT AFTER PAGE LOAD
        ========================================= */

        setTimeout(function() {

            pageStarted = true;

        }, 1000);



        /* =========================================
           MOUSE DETECTION
        ========================================= */

        document.addEventListener(
            "mousemove",
            function(event) {


                if (!pageStarted) {

                    return;

                }


                const rect =
                    noButton.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const dx =
                    centerX -
                    event.clientX;


                const dy =
                    centerY -
                    event.clientY;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (distance < 130) {


                    const now =
                        Date.now();


                    if (
                        now - lastMove < 180
                    ) {

                        return;

                    }


                    lastMove = now;


                    moveNoButton(
                        event.clientX,
                        event.clientY
                    );

                }

            }
        );



        /* =========================================
           MOVE NO BUTTON
        ========================================= */

        function moveNoButton(
            cursorX,
            cursorY
        ) {


            escapeCount++;


            const rect =
                noButton.getBoundingClientRect();


            const width =
                rect.width;


            const height =
                rect.height;


            let dx =
                (rect.left + width / 2)
                - cursorX;


            let dy =
                (rect.top + height / 2)
                - cursorY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (distance > 0) {

                dx =
                    dx / distance;

                dy =
                    dy / distance;

            }


            const escapeDistance =
                Math.min(
                    170 +
                    escapeCount * 10,
                    350
                );


            let newX =
                rect.left +
                dx * escapeDistance;


            let newY =
                rect.top +
                dy * escapeDistance;


            const maxX =
                window.innerWidth -
                width -
                10;


            const maxY =
                window.innerHeight -
                height -
                10;


            newX =
                Math.max(
                    10,
                    Math.min(
                        newX,
                        maxX
                    )
                );


            newY =
                Math.max(
                    10,
                    Math.min(
                        newY,
                        maxY
                    )
                );


            noButton.style.position =
                "fixed";


            noButton.style.left =
                newX + "px";


            noButton.style.top =
                newY + "px";



            /* =========================================
               CHANGE NO TEXT
            ========================================= */

            const messages = [

                "NO 😏",

                "Are you sure? 🤨",

                "Really? 😳",

                "Nice try! 😂",

                "Catch me! 😈",

                "Too slow! 🏃",

                "Nope! 😜",

                "Never! 😂"

            ];


            const index =
                Math.min(
                    escapeCount,
                    messages.length - 1
                );


            noButton.innerText =
                messages[index];



            /* =========================================
               MAKE YES BIGGER
            ========================================= */

            const newScale =
                Math.min(
                    1 +
                    escapeCount * 0.03,
                    1.35
                );


            yesButton.style.transform =
                `scale(${newScale})`;



            /* =========================================
               CREATE HEART
            ========================================= */

            createHeart(
                cursorX,
                cursorY
            );

        }



        /* =========================================
           NO BUTTON CLICK
        ========================================= */

        noButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                moveNoButton(
                    event.clientX,
                    event.clientY
                );

            }
        );



        /* =========================================
           YES BUTTON
        ========================================= */

        yesButton.addEventListener(
            "click",
            function() {


                /* Show message */

                loveMessage.style.display =
                    "block";


                /* Hide NO */

                noButton.style.display =
                    "none";


                /* Change YES */

                yesButton.innerText =
                    "YES ❤️❤️❤️";


                yesButton.style.transform =
                    "scale(1.2)";



                /* =====================================
                   SHOW 7 PHOTOS
                ===================================== */

                photoContainer.classList.add(
                    "show"
                );



                /* =====================================
                   CELEBRATION HEARTS
                ===================================== */

                for (
                    let i = 0;
                    i < 70;
                    i++
                ) {

                    setTimeout(
                        function() {

                            createHeart(

                                Math.random() *
                                window.innerWidth,

                                Math.random() *
                                window.innerHeight

                            );

                        },
                        i * 60
                    );

                }

            }
        );



        /* =========================================
           CLICK ANYWHERE = HEART
        ========================================= */

        document.addEventListener(
            "click",
            function(event) {

                createHeart(
                    event.clientX,
                    event.clientY
                );

            }
        );



        /* =========================================
           CREATE HEART
        ========================================= */

        function createHeart(
            x,
            y
        ) {


            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "heart";


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💓",
                "💘",
                "💝"

            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                x + "px";


            heart.style.top =
                y + "px";


            heart.style.fontSize =
                (
                    18 +
                    Math.random() * 25
                ) + "px";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function() {

                    heart.remove();

                },
                2000
            );

        }


    </script>

</body>

</html>
