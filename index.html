<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Important Question ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #fff0f5
                );

            position: relative;
        }


        /* =========================================
           PHOTO GALLERY
        ========================================= */

        .photo-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 4;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1s ease;
        }


        .photo-container.show {

            opacity: 1;

            visibility: visible;
        }


        /* =========================================
           PHOTO CARD
        ========================================= */

        .photo {

            position: absolute;

            background: white;

            padding: 7px;

            border-radius: 12px;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.20);

            overflow: hidden;

            opacity: 0;

            transform: scale(0.5);

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        .photo img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 7px;
        }


        /* =========================================
           PHOTO 1
           TOP LEFT
        ========================================= */

        .photo1 {

            width: 145px;
            height: 175px;

            left: 7%;

            top: 9%;

            transform:
                rotate(-8deg)
                scale(0.5);
        }


        /* =========================================
           PHOTO 2
           MIDDLE LEFT
        ========================================= */

        .photo2 {

            width: 130px;
            height: 160px;

            left: 3%;

            top: 40%;

            transform:
                rotate(6deg)
                scale(0.5);
        }


        /* =========================================
           PHOTO 3
           BOTTOM LEFT
        ========================================= */

        .photo3 {

            width: 140px;
            height: 170px;

            left: 10%;

            bottom: 7%;

            transform:
                rotate(-5deg)
                scale(0.5);
        }


        /* =========================================
           PHOTO 4
           TOP RIGHT
        ========================================= */

        .photo4 {

            width: 145px;
            height: 175px;

            right: 7%;

            top: 9%;

            transform:
                rotate(8deg)
                scale(0.5);
        }


        /* =========================================
           PHOTO 5
           MIDDLE RIGHT
        ========================================= */

        .photo5 {

            width: 130px;
            height: 160px;

            right: 3%;

            top: 40%;

            transform:
                rotate(-6deg)
                scale(0.5);
        }


        /* =========================================
           PHOTO 6
           BOTTOM RIGHT
        ========================================= */

        .photo6 {

            width: 140px;
            height: 170px;

            right: 10%;

            bottom: 7%;

            transform:
                rotate(5deg)
                scale(0.5);
        }


        /* =========================================
           PHOTO 7
           TOP CENTER
        ========================================= */

        .photo7 {

            width: 125px;
            height: 150px;

            left: 50%;

            top: 2%;

            transform:
                translateX(-50%)
                rotate(-2deg)
                scale(0.5);
        }


        /* =========================================
           PHOTO SHOW ANIMATION
        ========================================= */

        .photo-container.show .photo {

            opacity: 1;
        }


        .photo-container.show .photo1 {

            transform:
                rotate(-8deg)
                scale(1);

            transition-delay: 0.1s;
        }


        .photo-container.show .photo2 {

            transform:
                rotate(6deg)
                scale(1);

            transition-delay: 0.25s;
        }


        .photo-container.show .photo3 {

            transform:
                rotate(-5deg)
                scale(1);

            transition-delay: 0.4s;
        }


        .photo-container.show .photo4 {

            transform:
                rotate(8deg)
                scale(1);

            transition-delay: 0.55s;
        }


        .photo-container.show .photo5 {

            transform:
                rotate(-6deg)
                scale(1);

            transition-delay: 0.7s;
        }


        .photo-container.show .photo6 {

            transform:
                rotate(5deg)
                scale(1);

            transition-delay: 0.85s;
        }


        .photo-container.show .photo7 {

            transform:
                translateX(-50%)
                rotate(-2deg)
                scale(1);

            transition-delay: 1s;
        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .card {

            width: 90%;

            max-width: 520px;

            padding: 45px 30px;

            text-align: center;

            background:
                rgba(255,255,255,0.95);

            border-radius: 30px;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,0.15);

            position: relative;

            z-index: 20;
        }


        /* =========================================
           MAIN HEART
        ========================================= */

        .main-heart {

            font-size: 65px;

            animation:
                heartbeat
                1.2s
                infinite;
        }


        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           QUESTION
        ========================================= */

        h1 {

            color: #ff4081;

            font-size: 38px;

            margin: 15px 0;
        }


        p {

            color: #777;

            font-size: 17px;

            margin-bottom: 35px;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 25px;

            min-height: 60px;
        }


        button {

            border: none;

            padding: 15px 35px;

            border-radius: 30px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }


        /* =========================================
           YES
        ========================================= */

        #yesBtn {

            background: #ff4081;

            color: white;

            box-shadow:
                0 5px 15px
                rgba(255,64,129,0.4);

            transition:
                transform 0.2s;
        }


        #yesBtn:hover {

            transform: scale(1.08);
        }


        /* =========================================
           NO
        ========================================= */

        #noBtn {

            background: #dddddd;

            color: #555;

            z-index: 100;

            white-space: nowrap;

            transition:
                left 0.15s ease,
                top 0.15s ease;
        }


        /* =========================================
           LOVE MESSAGE
        ========================================= */

        #loveMessage {

            display: none;

            margin-top: 30px;

            color: #ff4081;

            font-size: 26px;

            font-weight: bold;
        }


        /* =========================================
           FLOATING HEARTS
        ========================================= */

        .heart {

            position: fixed;

            pointer-events: none;

            z-index: 999;

            font-size: 25px;

            animation:
                floatHeart
                2s
                ease-out
                forwards;
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    scale(0.5);

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-180px)
                    scale(1.5);

                opacity: 0;
            }
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            .photo1 {
                left: 2%;
            }

            .photo2 {
                left: 1%;
            }

            .photo3 {
                left: 4%;
            }

            .photo4 {
                right: 2%;
            }

            .photo5 {
                right: 1%;
            }

            .photo6 {
                right: 4%;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            h1 {
                font-size: 30px;
            }


            .card {

                width: 78%;

                max-width: 380px;

                padding: 32px 18px;
            }


            .main-heart {

                font-size: 50px;
            }


            button {

                padding: 12px 23px;

                font-size: 15px;
            }


            /* smaller photos */

            .photo1,
            .photo4 {

                width: 82px;

                height: 105px;
            }


            .photo2,
            .photo5 {

                width: 75px;

                height: 95px;
            }


            .photo3,
            .photo6 {

                width: 82px;

                height: 105px;
            }


            .photo7 {

                width: 75px;

                height: 92px;

                top: 1%;
            }


            .photo1 {
                left: 1%;
                top: 16%;
            }


            .photo2 {
                left: 0%;
                top: 43%;
            }


            .photo3 {
                left: 5%;
                bottom: 5%;
            }


            .photo4 {
                right: 1%;
                top: 16%;
            }


            .photo5 {
                right: 0%;
                top: 43%;
            }


            .photo6 {
                right: 5%;
                bottom: 5%;
            }

        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 430px) {

            .card {

                width: 74%;

                padding: 28px 12px;
            }


            h1 {

                font-size: 25px;
            }


            p {

                font-size: 14px;

                margin-bottom: 25px;
            }


            .main-heart {

                font-size: 45px;
            }


            button {

                padding: 10px 18px;

                font-size: 14px;
            }


            .photo1,
            .photo4 {

                width: 68px;

                height: 88px;
            }


            .photo2,
            .photo5 {

                width: 63px;

                height: 82px;
            }


            .photo3,
            .photo6 {

                width: 68px;

                height: 88px;
            }


            .photo7 {

                width: 65px;

                height: 80px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         PHOTO GALLERY
    ========================================== -->

    <div
        class="photo-container"
        id="photoContainer"
    >


        <!-- IMAGE 1 -->

        <div class="photo photo1">

            <img
                src="image1.jpg"
                alt="Photo 1"
            >

        </div>


        <!-- IMAGE 2 -->

        <div class="photo photo2">

            <img
                src="image2.jpg"
                alt="Photo 2"
            >

        </div>


        <!-- IMAGE 3 -->

        <div class="photo photo3">

            <img
                src="image3.jpg"
                alt="Photo 3"
            >

        </div>


        <!-- IMAGE 4 -->

        <div class="photo photo4">

            <img
                src="image4.jpg"
                alt="Photo 4"
            >

        </div>


        <!-- IMAGE 5 -->

        <div class="photo photo5">

            <img
                src="image5.jpg"
                alt="Photo 5"
            >

        </div>


        <!-- IMAGE 6 -->

        <div class="photo photo6">

            <img
                src="image6.jpg"
                alt="Photo 6"
            >

        </div>


        <!-- IMAGE 7 -->

        <div class="photo photo7">

            <img
                src="image7.jpg"
                alt="Photo 7"
            >

        </div>


    </div>



    <!-- =========================================
         MAIN CARD
    ========================================== -->

    <div class="card">


        <div class="main-heart">

            ❤️

        </div>


        <h1>

            Do you love me?

        </h1>


        <p>

            Please choose your answer carefully... 😌

        </p>


        <div class="buttons">


            <button id="yesBtn">

                YES ❤️

            </button>


            <button id="noBtn">

                NO 😏

            </button>


        </div>


        <div id="loveMessage">

            I KNEW IT!!! 😍❤️

            <br>

            <span
                style="
                    font-size:17px;
                    color:#888;
                "
            >

                You can't escape me now 😌💕

            </span>

        </div>


    </div>



    <script>


        /* =========================================
           ELEMENTS
        ========================================= */

        const yesButton =
            document.getElementById("yesBtn");


        const noButton =
            document.getElementById("noBtn");


        const loveMessage =
            document.getElementById("loveMessage");


        const photoContainer =
            document.getElementById("photoContainer");


        let escapeCount = 0;

        let lastMove = 0;

        let pageStarted = false;


        /* =========================================
           WAIT AFTER PAGE LOAD
        ========================================= */

        setTimeout(function() {

            pageStarted = true;

        }, 1000);


        /* =========================================
           NO BUTTON DETECTION
        ========================================= */

        document.addEventListener(
            "mousemove",
            function(event) {

                if (!pageStarted) {

                    return;

                }


                const rect =
                    noButton.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const dx =
                    centerX -
                    event.clientX;


                const dy =
                    centerY -
                    event.clientY;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (distance < 130) {

                    const now =
                        Date.now();


                    if (
                        now - lastMove < 180
                    ) {

                        return;

                    }


                    lastMove = now;


                    moveNoButton(
                        event.clientX,
                        event.clientY
                    );

                }

            }
        );


        /* =========================================
           MOVE NO BUTTON
        ========================================= */

        function moveNoButton(
            cursorX,
            cursorY
        ) {

            escapeCount++;


            const rect =
                noButton.getBoundingClientRect();


            const width =
                rect.width;


            const height =
                rect.height;


            let dx =
                (rect.left + width / 2)
                - cursorX;


            let dy =
                (rect.top + height / 2)
                - cursorY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (distance > 0) {

                dx /= distance;

                dy /= distance;

            }


            const escapeDistance =
                Math.min(
                    170 +
                    escapeCount * 10,
                    350
                );


            let newX =
                rect.left +
                dx * escapeDistance;


            let newY =
                rect.top +
                dy * escapeDistance;


            const maxX =
                window.innerWidth -
                width -
                10;


            const maxY =
                window.innerHeight -
                height -
                10;


            newX =
                Math.max(
                    10,
                    Math.min(
                        newX,
                        maxX
                    )
                );


            newY =
                Math.max(
                    10,
                    Math.min(
                        newY,
                        maxY
                    )
                );


            noButton.style.position =
                "fixed";


            noButton.style.left =
                newX + "px";


            noButton.style.top =
                newY + "px";


            const messages = [

                "NO 😏",

                "Are you sure? 🤨",

                "Really? 😳",

                "Nice try! 😂",

                "Catch me! 😈",

                "Too slow! 🏃",

                "Nope! 😜",

                "Never! 😂"

            ];


            const index =
                Math.min(
                    escapeCount,
                    messages.length - 1
                );


            noButton.innerText =
                messages[index];


            const newScale =
                Math.min(
                    1 +
                    escapeCount * 0.03,
                    1.35
                );


            yesButton.style.transform =
                `scale(${newScale})`;


            createHeart(
                cursorX,
                cursorY
            );

        }


        /* =========================================
           NO CLICK
        ========================================= */

        noButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                moveNoButton(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* =========================================
           YES CLICK
        ========================================= */

        yesButton.addEventListener(
            "click",
            function() {

                /* Show message */

                loveMessage.style.display =
                    "block";


                /* Hide NO */

                noButton.style.display =
                    "none";


                /* Change YES */

                yesButton.innerText =
                    "YES ❤️❤️❤️";


                yesButton.style.transform =
                    "scale(1.2)";


                /* Show photos */

                photoContainer.classList.add(
                    "show"
                );


                /* Celebration */

                for (
                    let i = 0;
                    i < 70;
                    i++
                ) {

                    setTimeout(
                        function() {

                            createHeart(

                                Math.random() *
                                window.innerWidth,

                                Math.random() *
                                window.innerHeight

                            );

                        },
                        i * 60
                    );

                }

            }
        );


        /* =========================================
           CLICK ANYWHERE = HEART
        ========================================= */

        document.addEventListener(
            "click",
            function(event) {

                createHeart(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* =========================================
           CREATE HEART
        ========================================= */

        function createHeart(
            x,
            y
        ) {

            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "heart";


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💓",
                "💘",
                "💝"

            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                x + "px";


            heart.style.top =
                y + "px";


            heart.style.fontSize =
                (
                    18 +
                    Math.random() * 25
                ) + "px";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function() {

                    heart.remove();

                },
                2000
            );

        }

    </script>

</body>

</html>
