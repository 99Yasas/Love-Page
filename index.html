<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #ffd6e7,
        #fff0f6,
        #ffd1e3
    );

    overflow-x: hidden;
    transition: background 1.5s ease;
}


/* =========================
   QUESTION SCREEN
========================= */

#questionScreen {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    transition:
        opacity 1s ease,
        transform 1s ease;
}


.question-card {

    width: 430px;
    max-width: 90%;

    padding: 45px 30px;

    text-align: center;

    background: rgba(255,255,255,0.96);

    border-radius: 35px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.15);

    position: relative;

    z-index: 10;
}


.main-heart {

    font-size: 75px;

    animation:
        heartbeat 1.2s infinite;
}


.question-card h1 {

    margin: 15px 0 10px;

    font-size: 38px;

    color: #ff4f81;
}


.question-card p {

    color: #777;

    font-size: 16px;

    margin-bottom: 30px;
}


/* =========================
   BUTTONS
========================= */

.buttons {

    display: flex;

    justify-content: center;

    gap: 20px;
}


button {

    border: none;

    padding: 15px 30px;

    border-radius: 50px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;
}


#yesBtn {

    background: #ff4f81;

    color: white;

    box-shadow:
        0 10px 25px rgba(255,79,129,0.35);
}


#yesBtn:hover {

    transform: scale(1.1);
}


#noBtn {

    background: #eeeeee;

    color: #555;
}


/* =========================
   MEMORY SCREEN
========================= */

#memoryScreen {

    display: none;

    min-height: 100vh;

    padding: 50px 20px 80px;

    text-align: center;

    opacity: 0;

    transform: translateY(30px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}


/* =========================
   TITLE
========================= */

.memory-title {

    font-size: 42px;

    color: #ff4f81;

    margin: 10px 0 5px;

    font-weight: bold;
}


.memory-subtitle {

    color: #777;

    font-size: 17px;

    margin-bottom: 45px;
}


/* =========================
   PHOTO GALLERY
========================= */

.gallery {

    max-width: 1100px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 35px;

    align-items: center;
}


/* Photo frame */

.memory {

    background: white;

    padding: 10px;

    border-radius: 12px;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.18);

    opacity: 0;

    transform:
        translateY(80px)
        scale(0.7);

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}


.memory.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


.memory img {

    width: 100%;

    aspect-ratio: 1 / 1.15;

    object-fit: cover;

    display: block;

    border-radius: 8px;
}


/* Different rotations */

.memory:nth-child(1) {
    transform: rotate(-6deg) translateY(80px) scale(0.7);
}

.memory:nth-child(2) {
    transform: rotate(4deg) translateY(80px) scale(0.7);
}

.memory:nth-child(3) {
    transform: rotate(-3deg) translateY(80px) scale(0.7);
}

.memory:nth-child(4) {
    transform: rotate(6deg) translateY(80px) scale(0.7);
}

.memory:nth-child(5) {
    transform: rotate(5deg) translateY(80px) scale(0.7);
}

.memory:nth-child(6) {
    transform: rotate(-5deg) translateY(80px) scale(0.7);
}

.memory:nth-child(7) {
    transform: rotate(3deg) translateY(80px) scale(0.7);
}


/* When visible */

.memory.show:nth-child(1) {
    transform: rotate(-6deg) translateY(0) scale(1);
}

.memory.show:nth-child(2) {
    transform: rotate(4deg) translateY(0) scale(1);
}

.memory.show:nth-child(3) {
    transform: rotate(-3deg) translateY(0) scale(1);
}

.memory.show:nth-child(4) {
    transform: rotate(6deg) translateY(0) scale(1);
}

.memory.show:nth-child(5) {
    transform: rotate(5deg) translateY(0) scale(1);
}

.memory.show:nth-child(6) {
    transform: rotate(-5deg) translateY(0) scale(1);
}

.memory.show:nth-child(7) {
    transform: rotate(3deg) translateY(0) scale(1);
}


/* Hover */

.memory:hover {

    transform:
        rotate(0deg)
        scale(1.08) !important;

    z-index: 10;

    box-shadow:
        0 20px 45px rgba(0,0,0,0.25);
}


/* =========================
   LOVE MESSAGE
========================= */

.love-message {

    margin: 55px auto 0;

    max-width: 700px;

    padding: 25px;

    background:
        rgba(255,255,255,0.75);

    border-radius: 25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);

    color: #ff4f81;

    font-size: 25px;

    font-weight: bold;
}


.love-message span {

    display: block;

    margin-top: 10px;

    color: #777;

    font-size: 16px;

    font-weight: normal;
}


/* =========================
   FLOATING HEARTS
========================= */

.heart {

    position: fixed;

    pointer-events: none;

    z-index: 999;

    animation:
        heartFloat 3s ease-out forwards;
}


@keyframes heartFloat {

    0% {

        transform:
            translateY(0)
            scale(0.5)
            rotate(0deg);

        opacity: 1;
    }

    100% {

        transform:
            translateY(-350px)
            scale(1.5)
            rotate(25deg);

        opacity: 0;
    }
}


/* =========================
   HEARTBEAT
========================= */

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

    .gallery {

        grid-template-columns:
            repeat(3, 1fr);

        gap: 25px;
    }

}


@media (max-width: 600px) {

    .question-card {

        padding: 35px 20px;
    }

    .question-card h1 {

        font-size: 30px;
    }

    .main-heart {

        font-size: 60px;
    }

    .gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 20px;
    }

    .memory-title {

        font-size: 32px;
    }

    .memory-subtitle {

        font-size: 15px;
    }

    .love-message {

        font-size: 20px;
    }

}


@media (max-width: 380px) {

    .gallery {

        grid-template-columns:
            1fr;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     QUESTION SCREEN
===================================================== -->

<section id="questionScreen">

    <div class="question-card">

        <div class="main-heart">
            ❤️
        </div>

        <h1>
            Do you love me?
        </h1>

        <p>
            Please choose your answer carefully... 😌
        </p>

        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😏
            </button>

        </div>

    </div>

</section>



<!-- =====================================================
     MEMORY SCREEN
===================================================== -->

<section id="memoryScreen">

    <h1 class="memory-title">
        Our Little Memories ❤️
    </h1>

    <p class="memory-subtitle">
        Every picture has a little piece of my heart 💕
    </p>


    <!-- PHOTO GALLERY -->

    <div class="gallery">


        <div class="memory">
            <img src="./image1.jpg" alt="Memory 1">
        </div>


        <div class="memory">
            <img src="./image2.jpg" alt="Memory 2">
        </div>


        <div class="memory">
            <img src="./image3.jpg" alt="Memory 3">
        </div>


        <div class="memory">
            <img src="./image4.jpg" alt="Memory 4">
        </div>


        <div class="memory">
            <img src="./image5.jpg" alt="Memory 5">
        </div>


        <div class="memory">
            <img src="./image6.jpg" alt="Memory 6">
        </div>


        <div class="memory">
            <img src="./image7.jpg" alt="Memory 7">
        </div>


    </div>


    <!-- LOVE MESSAGE -->

    <div class="love-message">

        I knew you would say YES! 😍❤️

        <span>
            Seven pictures, countless memories,
            and hopefully many more to come. 💕
        </span>

    </div>

</section>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const questionScreen =
    document.getElementById("questionScreen");

const memoryScreen =
    document.getElementById("memoryScreen");

const memories =
    document.querySelectorAll(".memory");


let gameStarted = false;

let lastMove = 0;


/* =====================================================
   START NO BUTTON
===================================================== */

setTimeout(function() {

    gameStarted = true;

}, 1000);


/* =====================================================
   NO BUTTON ESCAPES
===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!gameStarted) return;

        if (
            noBtn.style.display === "none"
        ) {
            return;
        }


        const rect =
            noBtn.getBoundingClientRect();


        const buttonX =
            rect.left +
            rect.width / 2;


        const buttonY =
            rect.top +
            rect.height / 2;


        const distance =
            Math.sqrt(

                Math.pow(
                    event.clientX - buttonX,
                    2
                )

                +

                Math.pow(
                    event.clientY - buttonY,
                    2
                )

            );


        if (distance < 140) {

            const now =
                Date.now();


            if (
                now - lastMove > 150
            ) {

                lastMove = now;

                moveNoButton(
                    event.clientX,
                    event.clientY
                );

            }

        }

    }
);


/* =====================================================
   MOVE NO BUTTON
===================================================== */

function moveNoButton(
    mouseX,
    mouseY
) {

    const rect =
        noBtn.getBoundingClientRect();


    const buttonX =
        rect.left +
        rect.width / 2;


    const buttonY =
        rect.top +
        rect.height / 2;


    let dx =
        buttonX - mouseX;


    let dy =
        buttonY - mouseY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        ) || 1;


    dx /= length;
    dy /= length;


    const distance =
        220;


    let newX =
        buttonX +
        dx * distance;


    let newY =
        buttonY +
        dy * distance;


    const margin = 20;


    newX =
        Math.max(
            margin + rect.width / 2,
            Math.min(
                window.innerWidth -
                margin -
                rect.width / 2,
                newX
            )
        );


    newY =
        Math.max(
            margin + rect.height / 2,
            Math.min(
                window.innerHeight -
                margin -
                rect.height / 2,
                newY
            )
        );


    noBtn.style.position =
        "fixed";


    noBtn.style.left =
        (
            newX -
            rect.width / 2
        ) + "px";


    noBtn.style.top =
        (
            newY -
            rect.height / 2
        ) + "px";


    const messages = [

        "NO 😏",
        "Are you sure? 🤨",
        "Really? 😳",
        "Nice try! 😂",
        "Catch me! 😈",
        "Too slow! 🏃",
        "Nope! 😜"

    ];


    noBtn.innerText =
        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];

}


/* =====================================================
   CLICK NO
===================================================== */

noBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        moveNoButton(
            event.clientX,
            event.clientY
        );

    }
);


/* =====================================================
   YES BUTTON
===================================================== */

yesBtn.addEventListener(
    "click",
    function() {

        /* Hide question */

        questionScreen.style.opacity = "0";

        questionScreen.style.transform =
            "scale(0.8)";


        /* Wait for transition */

        setTimeout(
            function() {

                questionScreen.style.display =
                    "none";


                /* Show memory section */

                memoryScreen.style.display =
                    "block";


                /* Force browser repaint */

                setTimeout(
                    function() {

                        memoryScreen.style.opacity =
                            "1";

                        memoryScreen.style.transform =
                            "translateY(0)";

                    },
                    50
                );


                /* Reveal photos one by one */

                memories.forEach(
                    function(photo, index) {

                        setTimeout(
                            function() {

                                photo.classList.add(
                                    "show"
                                );

                            },
                            300 +
                            index * 250
                        );

                    }
                );


                /* Big heart celebration */

                createManyHearts();


            },
            900
        );

    }
);


/* =====================================================
   CREATE ONE HEART
===================================================== */

function createHeart(
    x,
    y
) {

    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    const heartTypes = [

        "❤️",
        "💖",
        "💕",
        "💗",
        "💓",
        "💘",
        "💝"

    ];


    heart.innerText =
        heartTypes[
            Math.floor(
                Math.random() *
                heartTypes.length
            )
        ];


    heart.style.left =
        x + "px";


    heart.style.top =
        y + "px";


    heart.style.fontSize =
        (
            20 +
            Math.random() * 35
        ) + "px";


    document.body.appendChild(
        heart
    );


    setTimeout(
        function() {

            heart.remove();

        },
        3000
    );

}


/* =====================================================
   MANY HEARTS
===================================================== */

function createManyHearts() {

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        setTimeout(
            function() {

                createHeart(

                    Math.random() *
                    window.innerWidth,

                    window.innerHeight -
                    20

                );

            },

            i * 50
        );

    }

}


/* =====================================================
   CLICK ANYWHERE = HEART
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            event.target.tagName ===
            "BUTTON"
        ) {
            return;
        }


        createHeart(
            event.clientX,
            event.clientY
        );

    }
);

</script>

</body>
</html>
