<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Important Question ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffeef5, #ffd1e3);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= MAIN CARD ================= */

.card {
    width: 420px;
    max-width: 90%;
    padding: 45px 30px;
    text-align: center;
    background: rgba(255,255,255,0.96);
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    position: relative;
    z-index: 10;
}

.main-heart {
    font-size: 70px;
    animation: heartbeat 1.2s infinite;
}

h1 {
    margin: 15px 0 10px;
    color: #ff4f81;
    font-size: 38px;
}

p {
    color: #777;
    font-size: 16px;
}

/* ================= BUTTONS ================= */

.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#yesBtn {
    background: #ff4f81;
    color: white;
    box-shadow: 0 8px 20px rgba(255,79,129,0.35);
}

#yesBtn:hover {
    transform: scale(1.08);
}

#noBtn {
    background: #eeeeee;
    color: #555;
}

/* ================= LOVE MESSAGE ================= */

#loveMessage {
    display: none;
    margin-top: 25px;
    color: #ff4f81;
    font-size: 28px;
    font-weight: bold;
}

/* ================= PHOTOS ================= */

.photo {
    position: fixed;
    width: 135px;
    height: 170px;
    object-fit: cover;

    background: white;
    padding: 6px;

    border-radius: 18px;

    box-shadow: 0 12px 30px rgba(0,0,0,0.20);

    z-index: 2;

    transition: transform 0.3s;
}

.photo:hover {
    transform: scale(1.08) rotate(0deg);
    z-index: 20;
}

/* Photo 1 */
.photo1 {
    left: 4%;
    top: 7%;
    transform: rotate(-8deg);
}

/* Photo 2 */
.photo2 {
    left: 4%;
    bottom: 7%;
    transform: rotate(7deg);
}

/* Photo 3 */
.photo3 {
    left: 22%;
    top: 3%;
    transform: rotate(5deg);
}

/* Photo 4 */
.photo4 {
    right: 4%;
    top: 7%;
    transform: rotate(8deg);
}

/* Photo 5 */
.photo5 {
    right: 4%;
    bottom: 7%;
    transform: rotate(-7deg);
}

/* Photo 6 */
.photo6 {
    right: 22%;
    bottom: 3%;
    transform: rotate(-5deg);
}

/* Photo 7 */
.photo7 {
    left: 50%;
    top: 2%;
    transform: translateX(-50%) rotate(-3deg);
}

/* ================= FLOATING HEARTS ================= */

.floating-heart {
    position: fixed;
    pointer-events: none;
    font-size: 25px;
    z-index: 100;
    animation: floatHeart 2s ease-out forwards;
}

@keyframes floatHeart {

    0% {
        transform: translateY(0) scale(0.5);
        opacity: 1;
    }

    100% {
        transform: translateY(-180px) scale(1.5);
        opacity: 0;
    }
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

/* ================= MOBILE ================= */

@media (max-width: 900px) {

    body {
        overflow: auto;
        padding: 20px;
    }

    .card {
        margin: 130px 0;
    }

    .photo {
        width: 85px;
        height: 110px;
    }

    .photo1 {
        left: 2%;
        top: 2%;
    }

    .photo2 {
        left: 2%;
        bottom: 2%;
    }

    .photo3 {
        left: 20%;
        top: 1%;
    }

    .photo4 {
        right: 2%;
        top: 2%;
    }

    .photo5 {
        right: 2%;
        bottom: 2%;
    }

    .photo6 {
        right: 20%;
        bottom: 1%;
    }

    .photo7 {
        display: none;
    }
}

@media (max-width: 550px) {

    .card {
        width: 95%;
        padding: 35px 20px;
    }

    h1 {
        font-size: 30px;
    }

    .main-heart {
        font-size: 55px;
    }

    button {
        padding: 13px 22px;
        font-size: 16px;
    }

    .photo {
        width: 65px;
        height: 85px;
        padding: 4px;
        border-radius: 10px;
    }

    .photo3,
    .photo6,
    .photo7 {
        display: none;
    }
}

</style>
</head>

<body>


<!-- ================= YOUR 7 PHOTOS ================= -->

<img src="./image1.jpg" class="photo photo1" alt="Memory 1">

<img src="./image2.jpg" class="photo photo2" alt="Memory 2">

<img src="./image3.jpg" class="photo photo3" alt="Memory 3">

<img src="./image4.jpg" class="photo photo4" alt="Memory 4">

<img src="./image5.jpg" class="photo photo5" alt="Memory 5">

<img src="./image6.jpg" class="photo photo6" alt="Memory 6">

<img src="./image7.jpg" class="photo photo7" alt="Memory 7">


<!-- ================= MAIN CONTENT ================= -->

<div class="card">

    <div class="main-heart">
        ❤️
    </div>

    <h1>
        Do you love me?
    </h1>

    <p>
        Please choose your answer carefully... 😌
    </p>

    <div class="buttons">

        <button id="yesBtn">
            YES ❤️
        </button>

        <button id="noBtn">
            NO 😏
        </button>

    </div>

    <div id="loveMessage">

        I KNEW IT!!! 😍❤️

        <br>

        <span style="font-size:17px;color:#888;">
            You can't escape me now 😌💕
        </span>

    </div>

</div>


<script>

/* ================= VARIABLES ================= */

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const loveMessage = document.getElementById("loveMessage");

let escapeCount = 0;
let gameStarted = false;
let lastMove = 0;


/* ================= START GAME ================= */

setTimeout(function() {

    gameStarted = true;

}, 1000);


/* ================= NO BUTTON ESCAPE ================= */

document.addEventListener("mousemove", function(event) {

    if (!gameStarted) {
        return;
    }

    const rect = noBtn.getBoundingClientRect();

    const buttonX = rect.left + rect.width / 2;
    const buttonY = rect.top + rect.height / 2;

    const distance = Math.sqrt(
        Math.pow(event.clientX - buttonX, 2) +
        Math.pow(event.clientY - buttonY, 2)
    );

    if (distance < 140) {

        const now = Date.now();

        if (now - lastMove > 150) {

            lastMove = now;

            moveNoButton(
                event.clientX,
                event.clientY
            );
        }
    }

});


/* ================= MOVE NO BUTTON ================= */

function moveNoButton(mouseX, mouseY) {

    escapeCount++;

    const rect = noBtn.getBoundingClientRect();

    const buttonX = rect.left + rect.width / 2;
    const buttonY = rect.top + rect.height / 2;

    let dx = buttonX - mouseX;
    let dy = buttonY - mouseY;

    const length = Math.sqrt(dx * dx + dy * dy) || 1;

    dx = dx / length;
    dy = dy / length;

    const distance = Math.min(
        150 + escapeCount * 12,
        350
    );

    let newX = buttonX + dx * distance;
    let newY = buttonY + dy * distance;

    const margin = 20;

    newX = Math.max(
        margin + rect.width / 2,
        Math.min(
            window.innerWidth - margin - rect.width / 2,
            newX
        )
    );

    newY = Math.max(
        margin + rect.height / 2,
        Math.min(
            window.innerHeight - margin - rect.height / 2,
            newY
        )
    );

    noBtn.style.position = "fixed";

    noBtn.style.left =
        (newX - rect.width / 2) + "px";

    noBtn.style.top =
        (newY - rect.height / 2) + "px";


    /* Change NO button text */

    const messages = [

        "NO 😏",
        "Are you sure? 🤨",
        "Really? 😳",
        "Nice try! 😂",
        "Catch me! 😈",
        "Too slow! 🏃",
        "Nope! 😜",
        "Never! 😂"

    ];

    noBtn.innerText =
        messages[
            Math.min(
                escapeCount,
                messages.length - 1
            )
        ];


    /* YES button gets slightly bigger */

    yesBtn.style.transform =
        `scale(${1 + Math.min(
            escapeCount * 0.02,
            0.18
        )})`;

}


/* ================= CLICK NO ================= */

noBtn.addEventListener("click", function(event) {

    event.preventDefault();

    moveNoButton(
        event.clientX,
        event.clientY
    );

});


/* ================= YES BUTTON ================= */

yesBtn.addEventListener("click", function() {

    loveMessage.style.display = "block";

    noBtn.style.display = "none";

    yesBtn.innerText =
        "YES ❤️❤️❤️";

    yesBtn.style.transform =
        "scale(1.15)";


    /* Lots of hearts */

    for (let i = 0; i < 50; i++) {

        setTimeout(function() {

            createHeart(
                Math.random() * window.innerWidth,
                window.innerHeight - 50
            );

        }, i * 50);

    }

});


/* ================= CLICK ANYWHERE ================= */

document.addEventListener("click", function(event) {

    if (
        event.target.tagName === "BUTTON" ||
        event.target.tagName === "IMG"
    ) {
        return;
    }

    createHeart(
        event.clientX,
        event.clientY
    );

});


/* ================= CREATE HEART ================= */

function createHeart(x, y) {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";


    const hearts = [

        "❤️",
        "💖",
        "💕",
        "💗",
        "💓",
        "💘",
        "💝"

    ];


    heart.innerText =
        hearts[
            Math.floor(
                Math.random() * hearts.length
            )
        ];


    heart.style.left =
        x + "px";

    heart.style.top =
        y + "px";


    heart.style.fontSize =
        (20 + Math.random() * 25) + "px";


    document.body.appendChild(heart);


    setTimeout(function() {

        heart.remove();

    }, 2000);

}

</script>

</body>
</html>
