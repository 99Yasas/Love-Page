<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

/* ==============================
   RESET
================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;

    background:
        radial-gradient(circle at top left, #ffe1ed, transparent 40%),
        radial-gradient(circle at bottom right, #ffd2e3, transparent 40%),
        linear-gradient(135deg, #fff0f6, #ffd9e8);

    transition: background 1.5s ease;
}


/* ==============================
   QUESTION SCREEN
================================ */

#questionScreen {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 100;

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}


.questionCard {

    width: 430px;

    max-width: 90%;

    padding: 45px 30px;

    text-align: center;

    background: rgba(255,255,255,0.97);

    border-radius: 30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.18);

}


.bigHeart {

    font-size: 75px;

    animation:
        heartbeat 1.2s infinite;
}


.questionCard h1 {

    margin: 15px 0 10px;

    font-size: 38px;

    color: #ff4f81;
}


.questionCard p {

    color: #777;

    font-size: 16px;

    margin-bottom: 30px;
}


/* ==============================
   BUTTONS
================================ */

.buttons {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 20px;
}


button {

    border: none;

    padding: 15px 30px;

    border-radius: 50px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}


#yesBtn {

    background: #ff4f81;

    color: white;

    box-shadow:
        0 8px 25px rgba(255,79,129,0.35);

    transition:
        transform 0.2s ease;
}


#yesBtn:hover {

    transform: scale(1.08);
}


#noBtn {

    background: #eeeeee;

    color: #555;

    transition:
        left 0.25s ease,
        top 0.25s ease;
}


/* ==============================
   MEMORY SCREEN
================================ */

#memoryScreen {

    display: none;

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    opacity: 0;

    z-index: 10;

    transition:
        opacity 1s ease;
}


/* ==============================
   CENTER MESSAGE
================================ */

.centerMessage {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 430px;

    max-width: 80%;

    padding: 30px;

    text-align: center;

    background:
        rgba(255,255,255,0.94);

    border-radius: 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.15);

    z-index: 30;

    animation:
        messageAppear 1.2s ease;
}


.centerMessage h1 {

    margin: 0 0 10px;

    color: #ff4f81;

    font-size: 34px;
}


.centerMessage p {

    margin: 0;

    color: #777;

    font-size: 16px;

    line-height: 1.6;
}


/* ==============================
   PHOTOS
================================ */

.photo {

    position: absolute;

    width: 180px;

    height: 220px;

    padding: 8px;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);

    object-fit: cover;

    opacity: 0;

    transform: scale(0.2);

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;

    z-index: 20;
}


/* ==============================
   PHOTO POSITIONS
================================ */

.photo1 {
    left: 4%;
    top: 7%;
    transform: rotate(-9deg) scale(0.2);
}

.photo2 {
    left: 5%;
    bottom: 7%;
    transform: rotate(8deg) scale(0.2);
}

.photo3 {
    left: 27%;
    top: 4%;
    transform: rotate(5deg) scale(0.2);
}

.photo4 {
    right: 4%;
    top: 7%;
    transform: rotate(9deg) scale(0.2);
}

.photo5 {
    right: 5%;
    bottom: 7%;
    transform: rotate(-8deg) scale(0.2);
}

.photo6 {
    right: 27%;
    bottom: 4%;
    transform: rotate(-5deg) scale(0.2);
}

.photo7 {
    left: 50%;
    bottom: 1%;
    transform:
        translateX(-50%)
        rotate(3deg)
        scale(0.2);
}


/* ==============================
   VISIBLE PHOTOS
================================ */

.photo.show {

    opacity: 1;
}


/* Keep rotations after animation */

.photo1.show {
    transform: rotate(-9deg) scale(1);
}

.photo2.show {
    transform: rotate(8deg) scale(1);
}

.photo3.show {
    transform: rotate(5deg) scale(1);
}

.photo4.show {
    transform: rotate(9deg) scale(1);
}

.photo5.show {
    transform: rotate(-8deg) scale(1);
}

.photo6.show {
    transform: rotate(-5deg) scale(1);
}

.photo7.show {
    transform:
        translateX(-50%)
        rotate(3deg)
        scale(1);
}


/* Hover */

.photo:hover {

    z-index: 50;

    transform:
        rotate(0deg)
        scale(1.08) !important;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.3);
}


/* ==============================
   HEARTS
================================ */

.floatingHeart {

    position: fixed;

    z-index: 200;

    pointer-events: none;

    font-size: 30px;

    animation:
        heartAnimation 3s linear forwards;
}


@keyframes heartAnimation {

    0% {

        opacity: 1;

        transform:
            translateY(0)
            scale(0.5)
            rotate(0deg);
    }

    100% {

        opacity: 0;

        transform:
            translateY(-400px)
            scale(1.5)
            rotate(30deg);
    }
}


/* ==============================
   ANIMATIONS
================================ */

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}


@keyframes messageAppear {

    from {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.7);
    }

    to {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* ==============================
   MOBILE
================================ */

@media (max-width: 900px) {

    .photo {

        width: 120px;

        height: 150px;
    }

    .photo1 {
        left: 2%;
        top: 3%;
    }

    .photo2 {
        left: 2%;
        bottom: 3%;
    }

    .photo3 {
        left: 22%;
        top: 2%;
    }

    .photo4 {
        right: 2%;
        top: 3%;
    }

    .photo5 {
        right: 2%;
        bottom: 3%;
    }

    .photo6 {
        right: 22%;
        bottom: 2%;
    }

    .photo7 {
        bottom: 1%;
    }
}


@media (max-width: 600px) {

    .questionCard {

        padding: 35px 20px;
    }

    .questionCard h1 {

        font-size: 30px;
    }

    .bigHeart {

        font-size: 60px;
    }

    .photo {

        width: 80px;

        height: 105px;

        padding: 5px;

        border-radius: 10px;
    }

    .photo3,
    .photo6,
    .photo7 {

        display: none;
    }

    .centerMessage {

        width: 300px;

        padding: 22px;
    }

    .centerMessage h1 {

        font-size: 25px;
    }
}

</style>
</head>


<body>


<!-- ==========================================
     QUESTION
=========================================== -->

<div id="questionScreen">

    <div class="questionCard">

        <div class="bigHeart">
            ❤️
        </div>

        <h1>
            Do you love me?
        </h1>

        <p>
            Be honest... but choose wisely 😌💕
        </p>

        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😏
            </button>

        </div>

    </div>

</div>



<!-- ==========================================
     MEMORY SCREEN
=========================================== -->

<div id="memoryScreen">


    <!-- PHOTO 1 -->

    <img
        src="./image1.jpg"
        class="photo photo1"
        alt="Memory 1"
    >


    <!-- PHOTO 2 -->

    <img
        src="./image2.jpg"
        class="photo photo2"
        alt="Memory 2"
    >


    <!-- PHOTO 3 -->

    <img
        src="./image3.jpg"
        class="photo photo3"
        alt="Memory 3"
    >


    <!-- PHOTO 4 -->

    <img
        src="./image4.jpg"
        class="photo photo4"
        alt="Memory 4"
    >


    <!-- PHOTO 5 -->

    <img
        src="./image5.jpg"
        class="photo photo5"
        alt="Memory 5"
    >


    <!-- PHOTO 6 -->

    <img
        src="./image6.jpg"
        class="photo photo6"
        alt="Memory 6"
    >


    <!-- PHOTO 7 -->

    <img
        src="./image7.jpg"
        class="photo photo7"
        alt="Memory 7"
    >


    <!-- CENTER MESSAGE -->

    <div class="centerMessage">

        <h1>
            I KNEW IT! 😍❤️
        </h1>

        <p>
            You said YES! 💕
            <br><br>

            These are just a few of
            our beautiful memories.
            <br>

            Here's to making many more together. 🥰
        </p>

    </div>


</div>



<script>

/* ==========================================
   GET ELEMENTS
=========================================== */

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const questionScreen =
    document.getElementById("questionScreen");

const memoryScreen =
    document.getElementById("memoryScreen");

const photos =
    document.querySelectorAll(".photo");


let gameStarted = false;

let lastMove = 0;


/* ==========================================
   ENABLE NO BUTTON ESCAPE
=========================================== */

setTimeout(function() {

    gameStarted = true;

}, 800);


/* ==========================================
   NO BUTTON ESCAPES FROM MOUSE
=========================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!gameStarted) {
            return;
        }

        if (
            questionScreen.style.display ===
            "none"
        ) {
            return;
        }


        const rect =
            noBtn.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const distance =
            Math.sqrt(

                Math.pow(
                    event.clientX - centerX,
                    2
                )

                +

                Math.pow(
                    event.clientY - centerY,
                    2
                )

            );


        if (distance < 130) {

            const now =
                Date.now();


            if (
                now - lastMove > 180
            ) {

                lastMove = now;

                moveNoButton(
                    event.clientX,
                    event.clientY
                );

            }

        }

    }
);


/* ==========================================
   MOVE NO BUTTON
=========================================== */

function moveNoButton(
    mouseX,
    mouseY
) {

    const rect =
        noBtn.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        centerX - mouseX;


    let dy =
        centerY - mouseY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        ) || 1;


    dx /= distance;

    dy /= distance;


    const jump =
        220;


    let newX =
        centerX +
        dx * jump;


    let newY =
        centerY +
        dy * jump;


    const margin = 15;


    newX =
        Math.max(
            margin + rect.width / 2,
            Math.min(
                window.innerWidth -
                margin -
                rect.width / 2,
                newX
            )
        );


    newY =
        Math.max(
            margin + rect.height / 2,
            Math.min(
                window.innerHeight -
                margin -
                rect.height / 2,
                newY
            )
        );


    noBtn.style.position =
        "fixed";


    noBtn.style.left =
        (
            newX -
            rect.width / 2
        ) + "px";


    noBtn.style.top =
        (
            newY -
            rect.height / 2
        ) + "px";


    const texts = [

        "NO 😏",
        "Are you sure? 🤨",
        "Really? 😂",
        "Nice try! 😜",
        "Catch me! 😈",
        "Too slow! 🏃",
        "NOPE! 😂"

    ];


    noBtn.innerText =
        texts[
            Math.floor(
                Math.random() *
                texts.length
            )
        ];

}


/* ==========================================
   IF SHE TRIES TO CLICK NO
=========================================== */

noBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        moveNoButton(
            event.clientX,
            event.clientY
        );

    }
);


/* ==========================================
   YES CLICK
=========================================== */

yesBtn.addEventListener(
    "click",
    function() {


        /* ------------------------------
           Hide question
        ------------------------------- */

        questionScreen.style.opacity =
            "0";

        questionScreen.style.transform =
            "scale(0.7)";


        /* ------------------------------
           Wait for fade
        ------------------------------- */

        setTimeout(
            function() {


                questionScreen.style.display =
                    "none";


                /* --------------------------
                   Show memory screen
                --------------------------- */

                memoryScreen.style.display =
                    "block";


                /* Make it visible */

                setTimeout(
                    function() {

                        memoryScreen.style.opacity =
                            "1";

                    },
                    50
                );


                /* --------------------------
                   Show photos one by one
                --------------------------- */

                photos.forEach(
                    function(photo, index) {

                        setTimeout(
                            function() {

                                photo.classList.add(
                                    "show"
                                );

                            },

                            250 +
                            index * 300

                        );

                    }
                );


                /* --------------------------
                   Hearts
                --------------------------- */

                createHeartExplosion();


            },

            800
        );

    }
);


/* ==========================================
   HEART CREATION
=========================================== */

function createHeart(
    x,
    y
) {

    const heart =
        document.createElement("div");


    heart.className =
        "floatingHeart";


    const hearts = [

        "❤️",
        "💕",
        "💖",
        "💗",
        "💓",
        "💘",
        "💝",
        "🥰"

    ];


    heart.innerText =
        hearts[
            Math.floor(
                Math.random() *
                hearts.length
            )
        ];


    heart.style.left =
        x + "px";


    heart.style.top =
        y + "px";


    heart.style.fontSize =
        (
            20 +
            Math.random() * 30
        ) + "px";


    document.body.appendChild(
        heart
    );


    setTimeout(
        function() {

            heart.remove();

        },
        3000
    );

}


/* ==========================================
   HEART EXPLOSION
=========================================== */

function createHeartExplosion() {

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        setTimeout(
            function() {

                createHeart(

                    Math.random() *
                    window.innerWidth,

                    window.innerHeight +
                    20

                );

            },

            i * 35

        );

    }

}


/* ==========================================
   CLICK ANYWHERE = HEART
=========================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            event.target.tagName ===
            "BUTTON"
        ) {
            return;
        }


        createHeart(
            event.clientX,
            event.clientY
        );

    }
);

</script>

</body>
</html>
