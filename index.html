<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Important Question ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #fff0f5
                );

            position: relative;
        }


        /* MAIN CARD */

        .card {
            width: 90%;
            max-width: 520px;

            padding: 45px 30px;

            text-align: center;

            background: rgba(255,255,255,0.92);

            border-radius: 30px;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,0.15);

            position: relative;

            z-index: 10;
        }


        /* HEART */

        .main-heart {
            font-size: 65px;

            animation:
                heartbeat
                1.2s
                infinite;
        }


        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }


        /* QUESTION */

        h1 {
            color: #ff4081;

            font-size: 38px;

            margin: 15px 0;
        }


        p {
            color: #777;

            font-size: 17px;

            margin-bottom: 35px;
        }


        /* BUTTON AREA */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 25px;

            min-height: 60px;
        }


        button {

            border: none;

            padding: 15px 35px;

            border-radius: 30px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        /* YES */

        #yesBtn {

            background: #ff4081;

            color: white;

            box-shadow:
                0 5px 15px
                rgba(255,64,129,0.4);

            transition:
                transform 0.2s;
        }


        #yesBtn:hover {

            transform: scale(1.08);

        }


        /* NO */

        #noBtn {

            background: #dddddd;

            color: #555;

            z-index: 100;

            white-space: nowrap;

            transition:
                left 0.15s ease,
                top 0.15s ease;

        }


        /* MESSAGE */

        #loveMessage {

            display: none;

            margin-top: 30px;

            color: #ff4081;

            font-size: 26px;

            font-weight: bold;

        }


        /* CLICK HEART */

        .heart {

            position: fixed;

            pointer-events: none;

            z-index: 999;

            font-size: 25px;

            animation:
                floatHeart
                2s
                ease-out
                forwards;
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    scale(0.5);

                opacity: 1;

            }

            100% {

                transform:
                    translateY(-180px)
                    scale(1.5);

                opacity: 0;

            }

        }


        /* MOBILE */

        @media (max-width: 600px) {

            h1 {
                font-size: 30px;
            }

            .card {
                padding: 40px 20px;
            }

            button {
                padding: 13px 27px;
                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- MAIN CARD -->

    <div class="card">

        <div class="main-heart">
            ❤️
        </div>

        <h1>
            Do you love me?
        </h1>

        <p>
            Please choose your answer carefully... 😌
        </p>


        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😏
            </button>

        </div>


        <div id="loveMessage">

            I KNEW IT!!! 😍❤️

            <br>

            <span
                style="
                    font-size:17px;
                    color:#888;
                "
            >
                You can't escape me now 😌💕
            </span>

        </div>

    </div>



    <script>


        /* =========================================
           GET ELEMENTS
        ========================================= */

        const yesButton =
            document.getElementById("yesBtn");

        const noButton =
            document.getElementById("noBtn");

        const loveMessage =
            document.getElementById("loveMessage");


        let escapeCount = 0;

        let lastMove = 0;

        let pageStarted = false;



        /* =========================================
           IMPORTANT:
           WAIT A LITTLE AFTER PAGE LOAD
        ========================================= */

        setTimeout(function() {

            pageStarted = true;

        }, 1000);



        /* =========================================
           MOUSE DETECTION
        ========================================= */

        document.addEventListener(
            "mousemove",
            function(event) {


                /*
                    Don't allow the button
                    to escape immediately.
                */

                if (!pageStarted) {
                    return;
                }


                const rect =
                    noButton.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                /*
                    Distance from cursor
                    to NO button.
                */

                const dx =
                    centerX -
                    event.clientX;


                const dy =
                    centerY -
                    event.clientY;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                /*
                    START RUNNING WHEN
                    CURSOR IS 130px AWAY.
                */

                if (distance < 130) {


                    const now =
                        Date.now();


                    /*
                        Stop excessive movement.
                    */

                    if (
                        now - lastMove < 180
                    ) {
                        return;
                    }


                    lastMove = now;


                    moveNoButton(
                        event.clientX,
                        event.clientY
                    );

                }

            }
        );



        /* =========================================
           MOVE NO BUTTON AWAY FROM CURSOR
        ========================================= */

        function moveNoButton(
            cursorX,
            cursorY
        ) {


            escapeCount++;


            const rect =
                noButton.getBoundingClientRect();


            const width =
                rect.width;


            const height =
                rect.height;


            /*
                Direction from cursor
                AWAY from cursor.
            */

            let dx =
                (rect.left + width / 2)
                - cursorX;


            let dy =
                (rect.top + height / 2)
                - cursorY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
                Normalize direction.
            */

            if (distance > 0) {

                dx =
                    dx / distance;

                dy =
                    dy / distance;

            }


            /*
                How far it escapes.
            */

            const escapeDistance =
                Math.min(
                    170 +
                    escapeCount * 10,
                    350
                );


            /*
                Calculate new position.
            */

            let newX =
                rect.left +
                dx * escapeDistance;


            let newY =
                rect.top +
                dy * escapeDistance;


            /*
                Keep inside browser.
            */

            const maxX =
                window.innerWidth -
                width -
                10;


            const maxY =
                window.innerHeight -
                height -
                10;


            newX =
                Math.max(
                    10,
                    Math.min(
                        newX,
                        maxX
                    )
                );


            newY =
                Math.max(
                    10,
                    Math.min(
                        newY,
                        maxY
                    )
                );


            /*
                Move button.
            */

            noButton.style.position =
                "fixed";

            noButton.style.left =
                newX + "px";

            noButton.style.top =
                newY + "px";


            /*
                Change text.
            */

            const messages = [

                "NO 😏",

                "Are you sure? 🤨",

                "Really? 😳",

                "Nice try! 😂",

                "Catch me! 😈",

                "Too slow! 🏃",

                "Nope! 😜",

                "Never! 😂"

            ];


            const index =
                Math.min(
                    escapeCount,
                    messages.length - 1
                );


            noButton.innerText =
                messages[index];


            /*
                Make YES slightly bigger.
            */

            const newScale =
                Math.min(
                    1 +
                    escapeCount * 0.03,
                    1.35
                );


            yesButton.style.transform =
                `scale(${newScale})`;


            /*
                Heart where cursor is.
            */

            createHeart(
                cursorX,
                cursorY
            );

        }



        /* =========================================
           IF SHE SOMEHOW CLICKS NO
        ========================================= */

        noButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                moveNoButton(
                    event.clientX,
                    event.clientY
                );

            }
        );



        /* =========================================
           YES BUTTON
        ========================================= */

        yesButton.addEventListener(
            "click",
            function() {


                /*
                    Show message.
                */

                loveMessage.style.display =
                    "block";


                /*
                    Remove NO.
                */

                noButton.style.display =
                    "none";


                /*
                    Change YES.
                */

                yesButton.innerText =
                    "YES ❤️❤️❤️";


                yesButton.style.transform =
                    "scale(1.2)";


                /*
                    Celebration.
                */

                for (
                    let i = 0;
                    i < 50;
                    i++
                ) {

                    setTimeout(
                        function() {

                            createHeart(

                                Math.random() *
                                window.innerWidth,

                                Math.random() *
                                window.innerHeight

                            );

                        },
                        i * 60
                    );

                }

            }
        );



        /* =========================================
           CLICK ANYWHERE = HEART
        ========================================= */

        document.addEventListener(
            "click",
            function(event) {

                createHeart(
                    event.clientX,
                    event.clientY
                );

            }
        );



        /* =========================================
           CREATE HEART
        ========================================= */

        function createHeart(
            x,
            y
        ) {


            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "heart";


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💓",
                "💘",
                "💝"

            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                x + "px";


            heart.style.top =
                y + "px";


            heart.style.fontSize =
                (
                    18 +
                    Math.random() * 25
                ) + "px";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function() {

                    heart.remove();

                },
                2000
            );

        }



    </script>

</body>

</html>
