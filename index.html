<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Do You Love Me? ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #ffd6e7,
            #fff0f6,
            #ffd1e3
        );
}


/* =================================
   QUESTION SCREEN
================================= */

#questionScreen {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 1000;
}


.questionCard {

    width: 430px;

    max-width: 90%;

    padding: 45px 30px;

    text-align: center;

    background: white;

    border-radius: 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.18);
}


.bigHeart {

    font-size: 75px;

    animation: heartbeat 1.2s infinite;
}


.questionCard h1 {

    color: #ff4f81;

    font-size: 38px;

    margin: 15px 0 10px;
}


.questionCard p {

    color: #777;

    margin-bottom: 30px;
}


/* =================================
   BUTTONS
================================= */

.buttons {

    display: flex;

    justify-content: center;

    gap: 20px;
}


button {

    border: none;

    padding: 15px 30px;

    border-radius: 50px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}


#yesBtn {

    background: #ff4f81;

    color: white;

    box-shadow:
        0 8px 20px rgba(255,79,129,0.3);
}


#noBtn {

    background: #eeeeee;

    color: #555;
}


/* =================================
   MEMORY SCREEN
================================= */

#memoryScreen {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #fff5f9,
            #ffd9e8
        );
}


/* =================================
   CENTER MESSAGE
================================= */

.message {

    position: absolute;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 420px;

    max-width: 75%;

    padding: 30px;

    text-align: center;

    background:
        rgba(255,255,255,0.95);

    border-radius: 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.15);

    z-index: 20;

    animation:
        appear 1s ease;
}


.message h1 {

    color: #ff4f81;

    font-size: 34px;

    margin: 0 0 12px;
}


.message p {

    color: #777;

    line-height: 1.6;

    margin: 0;
}


/* =================================
   PHOTOS
================================= */

.memoryPhoto {

    position: absolute;

    width: 180px;

    height: 220px;

    padding: 8px;

    background: white;

    border-radius: 15px;

    object-fit: cover;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);

    opacity: 0;

    animation:
        photoAppear 1s ease forwards;
}


/* =================================
   PHOTO POSITIONS
================================= */

.p1 {
    left: 4%;
    top: 6%;
    transform: rotate(-8deg);
}

.p2 {
    left: 5%;
    bottom: 6%;
    transform: rotate(7deg);
}

.p3 {
    left: 25%;
    top: 3%;
    transform: rotate(5deg);
}

.p4 {
    right: 4%;
    top: 6%;
    transform: rotate(8deg);
}

.p5 {
    right: 5%;
    bottom: 6%;
    transform: rotate(-7deg);
}

.p6 {
    right: 25%;
    bottom: 3%;
    transform: rotate(-5deg);
}

.p7 {
    left: 50%;
    bottom: 1%;
    transform:
        translateX(-50%)
        rotate(3deg);
}


/* =================================
   PHOTO ANIMATION
================================= */

@keyframes photoAppear {

    0% {

        opacity: 0;

        transform:
            scale(0.2)
            rotate(0deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.08)
            rotate(0deg);
    }

    100% {

        opacity: 1;
    }
}


/* =================================
   HEARTS
================================= */

.heart {

    position: fixed;

    z-index: 2000;

    pointer-events: none;

    animation:
        heartFloat 3s ease-out forwards;
}


@keyframes heartFloat {

    0% {

        opacity: 1;

        transform:
            translateY(0)
            scale(0.5);
    }

    100% {

        opacity: 0;

        transform:
            translateY(-400px)
            scale(1.5)
            rotate(30deg);
    }
}


/* =================================
   HEARTBEAT
================================= */

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.7);
    }

    to {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =================================
   MOBILE
================================= */

@media (max-width: 900px) {

    .memoryPhoto {

        width: 120px;

        height: 150px;
    }

}


@media (max-width: 600px) {

    .questionCard h1 {

        font-size: 30px;
    }

    .bigHeart {

        font-size: 60px;
    }

    .memoryPhoto {

        width: 75px;

        height: 100px;
    }

    .p3,
    .p6,
    .p7 {

        display: none;
    }

    .message {

        width: 300px;

        padding: 22px;
    }

    .message h1 {

        font-size: 25px;
    }
}

</style>
</head>


<body>


<!-- =================================
     QUESTION
================================= -->

<div id="questionScreen">

    <div class="questionCard">

        <div class="bigHeart">
            ❤️
        </div>

        <h1>
            Do you love me?
        </h1>

        <p>
            Be honest... 😌💕
        </p>

        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😏
            </button>

        </div>

    </div>

</div>


<!-- =================================
     EMPTY MEMORY SCREEN
     
     IMPORTANT:
     THERE ARE NO PHOTOS HERE.
     JAVASCRIPT WILL CREATE THEM
     ONLY AFTER YES IS CLICKED.
================================= -->

<div id="memoryScreen">

</div>


<script>


/* =================================
   GET ELEMENTS
================================= */

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const questionScreen =
    document.getElementById("questionScreen");

const memoryScreen =
    document.getElementById("memoryScreen");


let lastMove = 0;

let gameStarted = false;


/* =================================
   START NO BUTTON
================================= */

setTimeout(function() {

    gameStarted = true;

}, 800);


/* =================================
   NO BUTTON ESCAPES
================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!gameStarted) {
            return;
        }


        if (
            questionScreen.style.display ===
            "none"
        ) {
            return;
        }


        const rect =
            noBtn.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const distance =
            Math.sqrt(

                Math.pow(
                    event.clientX - centerX,
                    2
                )

                +

                Math.pow(
                    event.clientY - centerY,
                    2
                )

            );


        if (distance < 130) {

            const now =
                Date.now();


            if (
                now - lastMove > 180
            ) {

                lastMove = now;

                moveNoButton(
                    event.clientX,
                    event.clientY
                );

            }

        }

    }
);


/* =================================
   MOVE NO BUTTON
================================= */

function moveNoButton(
    mouseX,
    mouseY
) {

    const rect =
        noBtn.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        centerX - mouseX;


    let dy =
        centerY - mouseY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        ) || 1;


    dx /= length;

    dy /= length;


    const jump = 220;


    let newX =
        centerX +
        dx * jump;


    let newY =
        centerY +
        dy * jump;


    const margin = 15;


    newX =
        Math.max(
            margin + rect.width / 2,
            Math.min(
                window.innerWidth -
                margin -
                rect.width / 2,
                newX
            )
        );


    newY =
        Math.max(
            margin + rect.height / 2,
            Math.min(
                window.innerHeight -
                margin -
                rect.height / 2,
                newY
            )
        );


    noBtn.style.position =
        "fixed";


    noBtn.style.left =
        (
            newX -
            rect.width / 2
        ) + "px";


    noBtn.style.top =
        (
            newY -
            rect.height / 2
        ) + "px";


    const messages = [

        "NO 😏",
        "Are you sure? 🤨",
        "Really? 😂",
        "Nice try! 😜",
        "Catch me! 😈",
        "Too slow! 🏃",
        "NOPE! 😂"

    ];


    noBtn.innerText =
        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];

}


/* =================================
   NO CLICK
================================= */

noBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        moveNoButton(
            event.clientX,
            event.clientY
        );

    }
);


/* =================================
   YES CLICK
================================= */

yesBtn.addEventListener(
    "click",
    function() {


        /* ---------------------------
           Hide question
        ---------------------------- */

        questionScreen.style.display =
            "none";


        /* ---------------------------
           Show memory screen
        ---------------------------- */

        memoryScreen.style.display =
            "block";


        /* ---------------------------
           Create photos ONLY NOW
        ---------------------------- */

        createPhotos();


        /* ---------------------------
           Create message
        ---------------------------- */

        createMessage();


        /* ---------------------------
           Hearts
        ---------------------------- */

        createHeartExplosion();

    }
);


/* =================================
   CREATE THE 7 PHOTOS
================================= */

function createPhotos() {

    const photos = [

        {
            file: "image1.jpg",
            className: "p1"
        },

        {
            file: "image2.jpg",
            className: "p2"
        },

        {
            file: "image3.jpg",
            className: "p3"
        },

        {
            file: "image4.jpg",
            className: "p4"
        },

        {
            file: "image5.jpg",
            className: "p5"
        },

        {
            file: "image6.jpg",
            className: "p6"
        },

        {
            file: "image7.jpg",
            className: "p7"
        }

    ];


    photos.forEach(
        function(photo, index) {


            setTimeout(
                function() {

                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        "./" +
                        photo.file;


                    img.className =
                        "memoryPhoto " +
                        photo.className;


                    img.alt =
                        "Our Memory " +
                        (index + 1);


                    memoryScreen.appendChild(
                        img
                    );


                },

                index * 250

            );

        }
    );

}


/* =================================
   CREATE CENTER MESSAGE
================================= */

function createMessage() {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message";


    message.innerHTML = `

        <h1>
            I KNEW IT! 😍❤️
        </h1>

        <p>
            You said YES! 💕
            <br><br>
            These memories are special,
            but I hope we make
            thousands more together. 🥰
        </p>

    `;


    memoryScreen.appendChild(
        message
    );

}


/* =================================
   CREATE HEART
================================= */

function createHeart(
    x,
    y
) {

    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "heart";


    const types = [

        "❤️",
        "💕",
        "💖",
        "💗",
        "💓",
        "💘",
        "💝",
        "🥰"

    ];


    heart.innerText =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];


    heart.style.left =
        x + "px";


    heart.style.top =
        y + "px";


    heart.style.fontSize =
        (
            20 +
            Math.random() * 30
        ) + "px";


    document.body.appendChild(
        heart
    );


    setTimeout(
        function() {

            heart.remove();

        },

        3000

    );

}


/* =================================
   HEART EXPLOSION
================================= */

function createHeartExplosion() {

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        setTimeout(
            function() {

                createHeart(

                    Math.random() *
                    window.innerWidth,

                    window.innerHeight + 20

                );

            },

            i * 35

        );

    }

}


/* =================================
   CLICK ANYWHERE = HEART
================================= */

document.addEventListener(
    "click",
    function(event) {

        if (
            event.target.tagName ===
            "BUTTON"
        ) {
            return;
        }


        createHeart(
            event.clientX,
            event.clientY
        );

    }
);

</script>

</body>
</html>
